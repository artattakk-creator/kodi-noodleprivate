name: Verify Kodi HTTPS install source
on:
  push:
    branches:
      - chore/verify-kodi-source-url-20261103
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check published GitHub Pages URL and ZIP locations without mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "PAGES_CONFIGURATION"
          gh api repos/artattakk-creator/kodi-noodleprivate/pages --jq '{html_url,status,source,build_type,public}' 2>&1
          for url in \
            "https://artattakk-creator.github.io/kodi-noodleprivate/online-test/" \
            "https://artattakk-creator.github.io/kodi-noodleprivate/online-test/index.html" \
            "https://artattakk-creator.github.io/kodi-noodleprivate/online-test/repository.gsmedia.pilot-1.9.7.zip" \
            "https://artattakk-creator.github.io/kodi-noodleprivate/online-test/script.gsmedia.setup-0.5.14.zip" \
            "https://raw.githubusercontent.com/artattakk-creator/kodi-noodleprivate/main/online-test/index.html" \
            "https://raw.githubusercontent.com/artattakk-creator/kodi-noodleprivate/main/online-test/"; do
              echo "TEST_URL $url"
              curl -L --silent --show-error --connect-timeout 8 --max-time 20 -o /dev/null \
                -w 'HTTP=%{http_code} CONTENT_TYPE=%{content_type} FINAL=%{url_effective} BYTES=%{size_download}\n' "$url"
          done
          set -e
          echo "KODI_HTTP_DIRECTORY_PARSER_CHECK"
          # Allow the Pages CDN to converge after a successful deployment.
          for pass in $(seq 1 10); do
            curl -LfsS --max-time 20 -H "Cache-Control: no-cache" \
              "https://artattakk-creator.github.io/kodi-noodleprivate/online-test/?verification=${GITHUB_RUN_ID}-$pass" -o /tmp/kodi-directory-index.html
            if grep -q 'repository.gsmedia.pilot-1.9.7.zip' /tmp/kodi-directory-index.html && \
               grep -q 'script.gsmedia.setup-0.5.14.zip' /tmp/kodi-directory-index.html; then
              break
            fi
            echo "Pages CDN still serving stale index (pass=$pass)"
            sleep 12
          done
          for filename in repository.gsmedia.pilot-1.9.7.zip script.gsmedia.setup-0.5.14.zip; do
            echo "ZIP_RESPONSE $filename"
            curl -fLsS --connect-timeout 8 --max-time 25 -o /tmp/neodark-checked.zip \
              -w 'HTTP=%{http_code} CONTENT_TYPE=%{content_type} BYTES=%{size_download}\n' \
              "https://artattakk-creator.github.io/kodi-noodleprivate/online-test/$filename?verification=${GITHUB_RUN_ID}"
            python - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/neodark-checked.zip') as z:
              assert z.testzip() is None
              print('PAGES_PUBLIC_ZIP_OK',len(z.namelist()))
          PY
          done
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path("/tmp/kodi-directory-index.html").read_text(encoding="utf-8")
          expr=r'<a href="([^"]*)"[^>]*>\s*(.*?)\s*</a>(.+?)(?=<a|</tr|$)'
          matches=[(m.group(1),m.group(2),m.group(3)) for m in re.finditer(expr,html,re.I)]
          expected=["repository.gsmedia.pilot-1.9.7.zip", "script.gsmedia.setup-0.5.14.zip"]
          visible=[href for href,name,meta in matches if href==name and meta]
          print("Public HTML excerpt:", html[:1000])
          print("Kodi HTTPDirectory recognized zip filenames:", visible)
          assert visible==expected, (matches,expected)
          PY
          exit 0
