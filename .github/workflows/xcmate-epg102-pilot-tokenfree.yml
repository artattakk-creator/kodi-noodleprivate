name: XCMate 0.1.29.102 public candidate
on:
  pull_request:
    paths:
      - 'src/plugin.video.xtreammate/**'
      - 'tools/package_xcmate_public.py'
      - 'tests/test_xcmate_epg_agent_public102.py'
      - '.github/workflows/xcmate-epg102-pilot-tokenfree.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run focused client tests
        env:
          PYTHONPATH: src/plugin.video.xtreammate/resources/lib
        run: |
          python -m unittest discover -s tests -p 'test_xcmate_epg_agent*.py' -v
          python -m unittest discover -s tests -p 'test_epg_agent*.py' -v
          python -m unittest discover -s tests -p 'test_xcmate_0293_setup_first_run.py' -v
          python -m unittest discover -s tests -p 'test_xcmate_service_idle102.py' -v
      - name: Verify public ZIP and SHA256
        run: |
          python -m pip install 'Pillow>=11,<13'
          python tools/package_xcmate_public.py "$RUNNER_TEMP/candidate"
          cd "$RUNNER_TEMP/candidate"
          sha256sum -c plugin.video.xtreammate-0.1.29.102.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: plugin.video.xtreammate-0.1.29.102-candidate
          path: ${{ runner.temp }}/candidate/plugin.video.xtreammate-0.1.29.102.zip*
          if-no-files-found: error
