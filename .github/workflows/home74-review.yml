name: Archived XCMate 74 Home stability and artwork review
on:
  push:
    branches: [fix/xcmate-02974-home-artwork]
  pull_request:
    branches: [main]
    paths: ['src/plugin.video.xtreammate/**', 'tests/**', 'tools/**', '.github/workflows/home74-review.yml']
permissions:
  contents: read
concurrency:
  group: home74-review-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  full-host:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fca469ca1a19ce65b8aa2628cd6e5c9e9dba1ef8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13' 'impacket==0.13.0' 'simpleeval==0.9.13'
      - name: All cumulative host regressions, no publication
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/home74"
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/home74/tests.txt"
          python tools/validate_kodi_po.py
      - name: Deterministic installable test package
        run: |
          python tools/package_xcmate71.py "$RUNNER_TEMP/home74" > "$RUNNER_TEMP/home74/package.json"
          cmp "$RUNNER_TEMP/home74/plugin.video.xtreammate-0.1.29.74.zip" docs/XCMate/test-builds/02974/plugin.video.xtreammate-0.1.29.74.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home74-host
          path: ${{ runner.temp }}/home74/
          retention-days: 30
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        resolution: [1920x1080,1280x720]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fca469ca1a19ce65b8aa2628cd6e5c9e9dba1ef8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'simpleeval==0.9.13'
      - name: Actual Kodi BINGIE focus, sources and image pixels
        run: python tools/run_kodi_home74_contract.py --report-dir "${{ runner.temp }}/native74" --resolution "${{ matrix.resolution }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home74-native-${{ matrix.resolution }}
          path: |
            ${{ runner.temp }}/native74/*.json
            ${{ runner.temp }}/native74/*.png
            ${{ runner.temp }}/native74/build.log
          retention-days: 30
