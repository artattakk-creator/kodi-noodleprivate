name: Issue482 independent artwork and EPG review
on:
  pull_request:
    branches: [automation/xcmate-artwork-epg-qa-20261117]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: issue482-${{ github.head_ref || github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        suite: [unittest, pytest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13' 'simpleeval==0.9.13' 'impacket==0.13.0' 'pytest>=8,<9'
      - name: Focused regressions, exact ZIP and language validation
        run: |
          python -m pytest -q tests/test_xcmate_artwork482.py tests/test_xcmate_mapping482.py tests/test_xcmate_issue474_save.py tests/test_xcmate_issue474_views.py tests/test_xcmate_mini_mapping_02996.py tests/test_xcmate_storage_logo_02996.py tests/test_xcmate_integration_02996.py
          python tools/validate_kodi_po.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          import release_candidate96 as p
          p.VERSION='0.1.29.97'
          print(p.inspect_package('docs/XCMate/test-builds/issue482/plugin.video.xtreammate-0.1.29.97.zip'))
          PY
      - name: Full cumulative suite, including inherited historical release contracts
        env:
          HOST_SUITE: ${{ matrix.suite }}
        shell: bash
        run: |
          set -o pipefail
          if [ "$HOST_SUITE" = unittest ]; then
            python tools/run_host94_contract.py -- python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/host.txt"
          else
            python tools/run_host94_contract.py -- python -m pytest tests -q 2>&1 | tee "$RUNNER_TEMP/host.txt"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue482-host-${{ matrix.suite }}
          path: |
            ${{ runner.temp }}/host.txt
            docs/XCMate/test-builds/issue482/*.zip
            docs/XCMate/test-builds/issue482/*.sha256
  baseline:
    if: github.event.action == 'opened' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1cea11d75c6f61accc39142aeb1c0004a88da4cb
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13' 'simpleeval==0.9.13' 'impacket==0.13.0' 'pytest>=8,<9'
      - name: Immutable .97 baseline, do not hide historical failures
        shell: bash
        run: |
          set -o pipefail
          python tools/run_host94_contract.py -- python -m pytest tests -q 2>&1 | tee "$RUNNER_TEMP/baseline-host.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue482-baseline-pytest
          path: ${{ runner.temp }}/baseline-host.txt
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        kind: [mapping, artwork]
        resolution: [1280x720, 1920x1080]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13' 'simpleeval==0.9.13'
      - name: Exact ZIP in real Linux Kodi; synthetic source, never Android
        run: python tools/run_issue482_native.py --kind '${{ matrix.kind }}' --report-dir '${{ runner.temp }}/native482' --addon-zip docs/XCMate/test-builds/issue482/plugin.video.xtreammate-0.1.29.97.zip --resolution '${{ matrix.resolution }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue482-native-${{ matrix.kind }}-${{ matrix.resolution }}
          path: |
            ${{ runner.temp }}/native482/*.json
            ${{ runner.temp }}/native482/*.png
            ${{ runner.temp }}/native482/*.txt
            ${{ runner.temp }}/native482/*.log
