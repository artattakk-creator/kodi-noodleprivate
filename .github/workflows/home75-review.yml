name: XCMate cumulative native Home and review
on:
  pull_request:
    branches: [main]
    paths: ['src/plugin.video.xtreammate/**', 'tests/**', 'tools/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: home75-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  native75:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: 1920x1080
            fault_seconds: 0
          - resolution: 1280x720
            fault_seconds: 1800
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13' 'simpleeval==0.9.13'
      - name: Synthetic movie stream generator
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Receiver gates, full bleed Hero, initial rows and actual detail playback
        run: python tools/run_kodi_home82_contract.py --report-dir "${{ runner.temp }}/native75" --resolution "${{ matrix.resolution }}" --fault-idle-seconds "${{ matrix.fault_seconds }}"
      - name: .75 code and preservation regressions
        run: |
          python -m unittest discover -s tests -p '*02975.py' -v
          python -m unittest discover -s tests -p '*02976.py' -v
          python -m unittest discover -s tests -p '*02977.py' -v
          python -m unittest discover -s tests -p '*02978.py' -v
          python -m unittest discover -s tests -p '*02979.py' -v
          python -m unittest discover -s tests -p '*02980.py' -v
          python -m unittest discover -s tests -p '*02981.py' -v
          python -m unittest discover -s tests -p '*02982.py' -v
          python -m unittest discover -s tests -p '*02983.py' -v
          python -m unittest discover -s tests -p '*02984.py' -v
      - name: Verify review ZIP exactly matches source
        run: |
          python tools/package_xcmate71.py "${{ runner.temp }}/package75"
          candidate_version="$(python -c 'import xml.etree.ElementTree as E; print(E.parse("src/plugin.video.xtreammate/addon.xml").getroot().get("version"))')"
          candidate_folder="media-spinner"
          if [ "$candidate_version" = "0.1.29.91" ]; then candidate_folder="02991"; fi
          cmp "${{ runner.temp }}/package75/plugin.video.xtreammate-$candidate_version.zip" "docs/XCMate/test-builds/$candidate_folder/plugin.video.xtreammate-$candidate_version.zip"
          python tools/release_channel75.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home75-${{ matrix.resolution }}
          path: |
            ${{ runner.temp }}/native75/*.json
            ${{ runner.temp }}/native75/*.png
            ${{ runner.temp }}/native75/probe.log
            ${{ runner.temp }}/native75/restart*.log
            ${{ runner.temp }}/native75/post75-error.txt
            ${{ runner.temp }}/native75/gui-error.txt
          retention-days: 30

  native-media77:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synthetic media generator
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: 20 native Stop ACK cycles per media type
        run: python tools/run_kodi_media77_contract.py --report-dir "${{ runner.temp }}/native77-media"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native77-media
          path: |
            ${{ runner.temp }}/native77-media/live.json
            ${{ runner.temp }}/native77-media/build.log
          retention-days: 30
