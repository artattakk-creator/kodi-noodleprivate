name: Publish Kodi updates
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/build_repository.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Kodi packages
        run: python tools/build_repository.py
      - name: Validate Python syntax
        run: python -m compileall -q src/plugin.video.noodleprivate
      - name: Commit and publish index, source and ZIPs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ addons.xml addons.xml.md5 repository.noodleprivate-0.1.0.zip plugin.video.noodleprivate/ repository.noodleprivate/
          if ! git diff --cached --quiet; then
            git commit -m "Publish Kodi addon build"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
