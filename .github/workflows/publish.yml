name: Publish GS Media Kodi updates
on:
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "src/**"
      - "tools/build_repository.py"
      - "tools/apply_xtreammate_upgrade.py"
      - "tools/apply_xtreammate_015.py"
      - ".release/xtreammate_0.1.5.patch.xz.b64"
      - "tools/apply_xtreammate_012.py"
      - ".release/xtreammate_0.1.2.patch.xz.b64"
      - ".release/xtreammate_0.1.1.patch.xz.b64"
      - "tools/bootstrap_xtreammate.py"
      - ".release/xtreammate_0.1.0.patch.xz.b64"
      - ".github/workflows/publish.yml"
  pull_request:
    branches: [main]
    paths:
      - "tests/**"
      - "src/**"
      - "tools/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
    inputs:
      publish_repository:
        description: 'Explicit owner approval to publish generated repository files on main'
        type: boolean
        required: false
        default: false
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install artwork build dependency
        run: python -m pip install 'Pillow>=11,<13'
      - name: Bootstrap pinned XtreamMate GPL source
        run: python tools/bootstrap_xtreammate.py
      - name: Apply XtreamMate 0.1.1 fix
        run: python tools/apply_xtreammate_upgrade.py
      - name: Apply XtreamMate 0.1.2 remote and startup functions
        run: python tools/apply_xtreammate_012.py
      - name: Apply XtreamMate 0.1.5 TV navigation, EPG, metadata and widgets
        run: python tools/apply_xtreammate_015.py
      - name: Build all Kodi addon packages and index
        run: python tools/build_repository.py
      - name: Check Python syntax
        run: python -m compileall -q src
      - name: Run Noodle Private regression tests
        run: |
          for f in tests/test_addon.py tests/test_site.py tests/test_providers.py; do
            sed -i "s@'..', 'plugin.video.noodleprivate'@'..', 'src', 'plugin.video.noodleprivate'@g" "$f"
          done
          python -m unittest discover -s tests -v 2>&1 | tee xcmate-test-results.log
      - name: Prepare XCMate pull request test package
        id: xcmate_package
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import hashlib, json, os, re, stat, zipfile
          from pathlib import Path, PurePosixPath
          import shutil
          import xml.etree.ElementTree as ET
          addon = ET.parse('src/plugin.video.xtreammate/addon.xml').getroot()
          filename = f"plugin.video.xtreammate-{addon.attrib['version']}.zip"
          output = Path('xcmate-review')
          output.mkdir()
          target = output / filename
          shutil.copyfile(Path('plugin.video.xtreammate') / filename, target)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          (output / (filename + '.sha256')).write_text(digest + '  ' + filename + '\n')
          if os.environ.get('GITHUB_OUTPUT'):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as result:
                  result.write('sha256=' + digest + '\n')
          source = Path('src/plugin.video.xtreammate')
          expected = {'plugin.video.xtreammate/' + str(p.relative_to(source)): p
                      for p in source.rglob('*') if p.is_file()
                      and '__pycache__' not in p.parts and p.suffix not in ('.pyc', '.pyo')
                      and p.name != '.DS_Store'}
          with zipfile.ZipFile(target) as archive:
              assert archive.testzip() is None, 'ZIP CRC failure'
              assert len(archive.namelist()) == len(set(archive.namelist())), 'Duplicate ZIP entry'
              assert set(archive.namelist()) == set(expected), 'Source/ZIP file mismatch'
              for entry in archive.infolist():
                  parts = PurePosixPath(entry.filename)
                  assert not parts.is_absolute() and '..' not in parts.parts
                  assert not stat.S_ISLNK(entry.external_attr >> 16)
                  assert not set(parts.parts) & {'.git', '__pycache__', 'tests', 'addon_data'}
                  assert parts.suffix.lower() not in {'.pyc', '.pyo', '.sqlite', '.db', '.log'}
                  assert parts.name not in {'.env', 'portals.json', 'xtreammate_groups.json',
                      'xtreammate_epg_sources.json', 'xtreammate_remote_actions.json'}
                  assert archive.read(entry) == expected[entry.filename].read_bytes(), entry.filename
              manifest = ET.fromstring(archive.read('plugin.video.xtreammate/addon.xml'))
              assert manifest.attrib['id'] == 'plugin.video.xtreammate'
              assert manifest.attrib['version'] == addon.attrib['version']
              for node in manifest.findall('.//assets/*'):
                  if node.tag in ('icon', 'fanart', 'screenshot'):
                      assert 'plugin.video.xtreammate/' + node.text in archive.namelist(), node.text
          log = Path('xcmate-test-results.log').read_text()
          match = re.search(r'Ran (\d+) tests? in ([0-9.]+)s', log)
          assert match and '\nOK' in log and '\nFAILED' not in log
          shutil.copyfile('xcmate-test-results.log', output / 'test-results.log')
          (output / 'build-verification.json').write_text(json.dumps(dict(
              commit=os.environ['GITHUB_SHA'], version=addon.attrib['version'],
              tests=int(match.group(1)), seconds=float(match.group(2)),
              files=len(expected), bytes=target.stat().st_size, sha256=digest,
              crc='PASS', paths='PASS', source_bytes='PASS', production_publish=False), indent=2) + '\n')
          PY
      - name: Upload XCMate pull request test package
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: xcmate-review-${{ github.event.pull_request.number || github.run_id }}-${{ steps.xcmate_package.outputs.sha256 }}
          path: xcmate-review/
          if-no-files-found: error
          retention-days: 14
      - name: Commit and publish generated archives
        if: github.event_name == 'workflow_dispatch' && inputs.publish_repository == true && github.ref == 'refs/heads/main' && github.actor == 'artattakk-creator'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish GS Media Kodi repository"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
