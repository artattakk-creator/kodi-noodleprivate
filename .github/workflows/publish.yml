name: Publish GS Media Kodi updates
on:
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "src/**"
      - "tools/build_repository.py"
      - "tools/apply_xtreammate_upgrade.py"
      - "tools/apply_xtreammate_015.py"
      - ".release/xtreammate_0.1.5.patch.xz.b64"
      - "tools/apply_xtreammate_012.py"
      - ".release/xtreammate_0.1.2.patch.xz.b64"
      - ".release/xtreammate_0.1.1.patch.xz.b64"
      - "tools/bootstrap_xtreammate.py"
      - ".release/xtreammate_0.1.0.patch.xz.b64"
      - ".github/workflows/publish.yml"
  pull_request:
    branches: [main, "fix/xcmate-02927-*", "fix/xcmate-02928-*"]
    paths:
      - "tests/**"
      - "src/**"
      - "tools/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gs-kodi-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  kodi-live67-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check synthetic native playback harness syntax
        run: python -m compileall -q tools/kodi_live67_host tools/run_kodi_live67_contract.py
      - name: Install synthetic media generator
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Decode TS, HLS and automatic live streams through native Kodi
        run: python tools/run_kodi_live67_contract.py --report-dir kodi-live67-evidence
      - name: Upload isolated playback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodi21-live67-playback-${{ github.sha }}
          path: |
            kodi-live67-evidence/live.json
            kodi-live67-evidence/build.log
          if-no-files-found: error
          retention-days: 14
  kodi-helper57-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check .67 source syntax and cumulative regression contracts
        run: |
          python -m pip install 'Pillow>=11,<13' 'impacket==0.13.0' 'simpleeval==0.9.13'
          python -m compileall -q src tools/kodi_home64_host tools/run_kodi_home64_contract.py tools/kodi_home66_host tools/run_kodi_home66_contract.py tools/build_bingie66_review.py
          python -m unittest discover -s tests -p '*02967.py' -v
          python -m unittest discover -s tests -p '*02966.py' -v
          python -m unittest discover -s tests -p '*02965.py' -v
          python -m unittest discover -s tests -p '*02964.py' -v
          python -m unittest discover -s tests -p '*02963.py' -v
          python -m unittest discover -s tests -p 'test_xcmate_home_02955.py' -v
      - name: Verify native .66 mixed third-party poster music focus and shared TV artwork
        run: python tools/run_kodi_home66_contract.py --report-dir kodi-home66-evidence
      - name: Verify historic affected wizard, metadata, remote and frozen-search contracts
        run: |
          python - <<'PY'
          import sys,unittest
          sys.path.insert(0,'tests')
          modules=['test_xcmate_programme_index_02946.ProgrammeIndex46.test_stale_fact_metadata_cannot_survive_source_image_revision','test_xcmate_catalog_02954','test_xcmate_programme_index_02946','test_xcmate_series_02952','test_xcmate_tv_025','test_xcmate_027_ui','test_xcmate_028_streaming','test_xcmate_media_layout_02919','test_xcmate_media_rails_0299','test_xcmate_menu_icons_02945','test_xcmate_scope_02943','test_xcmate_scope_02944','test_xcmate_scope_02945','test_xcmate_scope_02946']
          result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromNames(modules))
          if not result.wasSuccessful():raise SystemExit(1)
          PY
      - name: Measure frozen .64 versus .65 target access and warm EPG
        run: python tools/benchmark_xcmate65.py --output xcmate65-host-evidence.json
      - name: Measure .66 persistent cold and warm coverage of all 88 channels
        run: python tools/benchmark_xcmate66.py --output xcmate66-host-evidence.json
      - name: Verify .64 native movie and series focus, ten provider posters and Live return
        run: python tools/run_kodi_home64_contract.py --report-dir kodi-home64-evidence
      - name: Verify real Kodi 21 Linux plugin and worker RPC transport
        run: python tools/run_kodi_helper57_contract.py --report-dir kodi-helper57-evidence
      - name: Verify native XCMate widget directories and synthetic poster pixels
        run: python tools/run_kodi_widget59_contract.py --report-dir kodi-widget59-evidence
      - name: Install native Skinshortcuts compiler dependency
        run: python -m pip install 'simpleeval==0.9.13'
      - name: Verify BINGIE 2.2.3 native Home, complete Live row and cached Hero pixels
        run: python tools/run_kodi_home60_contract.py --report-dir kodi-home60-evidence
      - name: Verify visible .61 setup menu, explicit approval and no-token native Home
        run: python tools/run_kodi_home61_contract.py --report-dir kodi-home61-evidence
      - name: Verify .62 Live identities under failed enrichment and 803 groups
        run: python tools/run_kodi_home62_contract.py --report-dir kodi-home62-evidence
      - name: Verify .63 full-bleed Hero, text pixels and warm local snapshot
        run: python tools/run_kodi_home63_contract.py --report-dir kodi-home63-evidence
      - name: Upload isolated Kodi transport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodi21-helper57-transport-${{ github.sha }}
          path: |
            xcmate65-host-evidence.json
            xcmate66-host-evidence.json
            kodi-home66-evidence/home.json
            kodi-home66-evidence/*.png
            kodi-home66-evidence/media66.json
            kodi-home66-evidence/build.log
            kodi-helper57-evidence/transport.json
            kodi-helper57-evidence/build.log
            kodi-widget59-evidence/widgets.json
            kodi-widget59-evidence/native-widget59.png
            kodi-widget59-evidence/build.log
            kodi-home60-evidence/home.json
            kodi-home60-evidence/home60-0.png
            kodi-home60-evidence/home60-1.png
            kodi-home60-evidence/home60-87.png
            kodi-home60-evidence/build.log
            kodi-home61-evidence/home.json
            kodi-home61-evidence/home61-0.png
            kodi-home61-evidence/home61-1.png
            kodi-home61-evidence/home61-87.png
            kodi-home61-evidence/build.log
            kodi-home62-evidence/home.json
            kodi-home62-evidence/home62-0.png
            kodi-home62-evidence/home62-1.png
            kodi-home62-evidence/home62-87.png
            kodi-home62-evidence/build.log
            kodi-home63-evidence/home.json
            kodi-home63-evidence/home63-0.png
            kodi-home63-evidence/home63-1.png
            kodi-home63-evidence/home63-87.png
            kodi-home63-evidence/build.log
            kodi-home64-evidence/home.json
            kodi-home64-evidence/*.png
            kodi-home64-evidence/media64.json
            kodi-home64-evidence/build.log
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [kodi-helper57-transport, kodi-live67-playback]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install host test dependencies
        run: python -m pip install 'Pillow>=11,<13' 'impacket==0.13.0' 'simpleeval==0.9.13'
      - name: Bootstrap pinned XtreamMate GPL source
        run: python tools/bootstrap_xtreammate.py
      - name: Apply XtreamMate 0.1.1 fix
        run: python tools/apply_xtreammate_upgrade.py
      - name: Apply XtreamMate 0.1.2 remote and startup functions
        run: python tools/apply_xtreammate_012.py
      - name: Apply XtreamMate 0.1.5 TV navigation, EPG, metadata and widgets
        run: python tools/apply_xtreammate_015.py
      - name: Build all Kodi addon packages and index
        run: python tools/build_repository.py
      - name: Verify canonical XCMate source ZIP and regular Kodi index
        run: python tools/verify_xcmate67_package.py
      - name: Validate Kodi gettext languages
        run: python tools/validate_kodi_po.py
      - name: Validate pinned navigation icons and license
        run: python tools/build_xcmate_nav_icons.py --check
      - name: Check Python syntax
        run: python -m compileall -q src
      - name: Run Noodle Private regression tests
        run: |
          set -o pipefail
          for f in tests/test_addon.py tests/test_site.py tests/test_providers.py; do
            sed -i "s@'..', 'plugin.video.noodleprivate'@'..', 'src', 'plugin.video.noodleprivate'@g" "$f"
          done
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/xcmate67-test-results.log"
      - name: Prepare XCMate pull request test package
        id: xcmate_package
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import hashlib, json, os, re, stat, zipfile
          from pathlib import Path, PurePosixPath
          import shutil
          import xml.etree.ElementTree as ET
          addon = ET.parse('src/plugin.video.xtreammate/addon.xml').getroot()
          filename = f"plugin.video.xtreammate-{addon.attrib['version']}.zip"
          output = Path('xcmate-review')
          output.mkdir()
          target = output / filename
          shutil.copyfile(Path('plugin.video.xtreammate') / filename, target)
          digest = hashlib.sha256(target.read_bytes()).hexdigest()
          # Cumulative test branches can supply a reviewed ZIP. Ensure CI regenerates
          # those exact bytes, including the ZIP committed on this PR head.
          suffix = '0' + ''.join(addon.attrib['version'].split('.')[2:])
          supplied = Path('docs/XCMate/TESTERGEBNISSE_' + suffix + '.json')
          if os.environ.get('GITHUB_HEAD_REF', '').startswith('test/') and supplied.is_file():
              import subprocess
              declared = json.loads(supplied.read_text())
              assert declared['sha256'] == digest, 'Review ZIP differs from source build'
              committed = subprocess.run(['git', 'show', 'HEAD:plugin.video.xtreammate/' + filename],
                                         capture_output=True, check=True).stdout
              assert hashlib.sha256(committed).hexdigest() == digest, 'Committed review ZIP differs'
              print('SUPPLIED_REVIEW_ZIP_SHA256', digest)
          (output / (filename + '.sha256')).write_text(digest + '  ' + filename + '\n')
          if os.environ.get('GITHUB_OUTPUT'):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as result:
                  result.write('sha256=' + digest + '\n')
          source = Path('src/plugin.video.xtreammate')
          expected = {'plugin.video.xtreammate/' + str(p.relative_to(source)): p
                      for p in source.rglob('*') if p.is_file()
                      and '__pycache__' not in p.parts and p.suffix not in ('.pyc', '.pyo')
                      and p.name != '.DS_Store'}
          with zipfile.ZipFile(target) as archive:
              assert archive.testzip() is None, 'ZIP CRC failure'
              assert len(archive.namelist()) == len(set(archive.namelist())), 'Duplicate ZIP entry'
              assert set(archive.namelist()) == set(expected), 'Source/ZIP file mismatch'
              for entry in archive.infolist():
                  parts = PurePosixPath(entry.filename)
                  assert not parts.is_absolute() and '..' not in parts.parts
                  assert not stat.S_ISLNK(entry.external_attr >> 16)
                  assert not set(parts.parts) & {'.git', '__pycache__', 'tests', 'addon_data'}
                  assert parts.suffix.lower() not in {'.pyc', '.pyo', '.sqlite', '.db', '.log'}
                  assert parts.name not in {'.env', 'portals.json', 'xtreammate_groups.json',
                      'xtreammate_epg_sources.json', 'xtreammate_remote_actions.json'}
                  assert archive.read(entry) == expected[entry.filename].read_bytes(), entry.filename
              manifest = ET.fromstring(archive.read('plugin.video.xtreammate/addon.xml'))
              assert manifest.attrib['id'] == 'plugin.video.xtreammate'
              assert manifest.attrib['version'] == addon.attrib['version']
              for node in manifest.findall('.//assets/*'):
                  if node.tag in ('icon', 'fanart', 'screenshot'):
                      assert 'plugin.video.xtreammate/' + node.text in archive.namelist(), node.text
          testlog = Path(os.environ['RUNNER_TEMP']) / 'xcmate67-test-results.log'
          log = testlog.read_text()
          match = re.search(r'Ran (\d+) tests? in ([0-9.]+)s', log)
          assert match and '\nOK' in log and '\nFAILED' not in log
          shutil.copyfile(testlog, output / 'test-results.log')
          (output / 'build-verification.json').write_text(json.dumps(dict(
              commit=os.environ['GITHUB_SHA'], version=addon.attrib['version'],
              tests=int(match.group(1)), seconds=float(match.group(2)),
              files=len(expected), bytes=target.stat().st_size, sha256=digest,
              crc='PASS', paths='PASS', source_bytes='PASS', production_publish=False), indent=2) + '\n')
          PY
      - name: Upload XCMate pull request test package
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: xcmate-review-${{ github.event.pull_request.number || github.run_id }}-${{ steps.xcmate_package.outputs.sha256 }}
          path: xcmate-review/
          if-no-files-found: error
          retention-days: 14
      - name: Commit and publish generated archives
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import xml.etree.ElementTree as ET
          # Stage only builder-owned repository outputs. CI logs, test fixtures,
          # review artifacts and working-tree source edits are never published.
          outputs=['addons.xml','addons.xml.md5']
          for manifest in sorted(Path('src').glob('*/addon.xml')):
              addon=ET.parse(manifest).getroot()
              ident=addon.attrib['id'];version=addon.attrib['version']
              package=ident+'-'+version+'.zip'
              outputs.append(str(Path(ident)/package))
              if ident=='plugin.video.xtreammate':
                  outputs.append(str(Path(ident)/(package+'.sha256')))
              for icon in addon.findall("extension[@point='xbmc.addon.metadata']/assets/icon"):
                  relative=Path(icon.text or '')
                  if relative.is_absolute() or '..' in relative.parts:raise ValueError('UNSAFE_REPO_ASSET')
                  target=Path(ident)/relative
                  if target.is_file():outputs.append(str(target))
              if ident.startswith('repository.'):
                  outputs.append(package)
                  if ident=='repository.gsmedia':outputs.append(str(Path('repository-programme')/package))
          subprocess.run(['git','add','--',*outputs],check=True)
          PY
          if ! git diff --cached --quiet; then
            git commit -m "Publish GS Media Kodi repository"
            git -c rebase.autoStash=true pull --rebase origin main
            git push origin HEAD:main
          fi
