name: Publish GS Media Kodi updates
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/build_repository.py"
      - ".github/workflows/publish.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build all Kodi addon packages and index
        run: python tools/build_repository.py
      - name: Check Python syntax
        run: python -m compileall -q src
      - name: Commit and publish generated archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish GS Media Kodi repository"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
