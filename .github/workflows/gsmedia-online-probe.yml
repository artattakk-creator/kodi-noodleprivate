name: Verify GS Media Kodi public HTTPS bootstrap
on:
  push:
    branches: [main]
    paths: [".github/workflows/gsmedia-online-probe.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-kodi-source:
    runs-on: ubuntu-latest
    steps:
      - name: Probe online Kodi directory and ZIP from outside GitHub
        run: |
          python - <<'PY'
          import urllib.request,urllib.error,hashlib,html.parser,time
          urls=[
          'https://artattakk-creator.github.io/kodi-noodleprivate/online-test/',
          'https://artattakk-creator.github.io/kodi-noodleprivate/',
          'https://cdn.jsdelivr.net/gh/artattakk-creator/kodi-noodleprivate@main/online-test/',
          'https://raw.githubusercontent.com/artattakk-creator/kodi-noodleprivate/main/online-test/repository.gsmedia.pilot-1.8.2.zip'
          ]
          for url in urls:
              for n in range(2):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'Kodi-InstallProbe/1.0'})
                      with urllib.request.urlopen(req,timeout=15) as r:
                          data=r.read(300_000)
                          body=data[:140].decode('utf-8','replace') if not data.startswith(b'PK') else '<ZIP>'
                          print('STATUS',r.status,'URL',url,'CTYPE',r.headers.get('content-type'),'SAMPLE',repr(body))
                      break
                  except Exception as e:
                      print('FAILED',url,type(e).__name__,str(e)[:200])
                      if n==0:time.sleep(4)
          PY
