name: XCMate 0.1.29.103 installable candidate
on:
  push:
    branches: [fix/xcmate-517-029103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host dependency
        run: python -m pip install 'Pillow>=11,<13' 'simpleeval==0.9.13'
      - name: Run focused client tests
        env:
          PYTHONPATH: src/plugin.video.xtreammate/resources/lib
        run: |
          python -m unittest discover -s tests -p 'test_xcmate_epg_agent*.py' -v
          python -m unittest discover -s tests -p 'test_epg_agent*.py' -v
          python -m unittest discover -s tests -p 'test_xcmate_0293_setup_first_run.py' -v
          python -m unittest discover -s tests -p 'test_xcmate_service_idle102.py' -v
          python -m unittest discover -s tests -p 'test_*103.py' -v
      - name: Verify public ZIP and SHA256
        id: package
        run: |
          artifact="plugin.video.xtreammate-0.1.29.103"
          python tools/package_xcmate_public.py "$RUNNER_TEMP/candidate" --version 0.1.29.103
          (cd "$RUNNER_TEMP/candidate" && sha256sum -c "$artifact.zip.sha256")
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}-candidate
          path: ${{ runner.temp }}/candidate/${{ steps.package.outputs.artifact }}.zip*
          if-no-files-found: error
