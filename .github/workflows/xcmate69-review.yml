name: XCMate .69 focused review
on:
  pull_request:
    branches: [main]
    paths: ["src/**", "tests/**", "tools/**", ".github/workflows/xcmate69-review.yml"]
permissions:
  contents: read
concurrency:
  group: xcmate69-review-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read pinned .68 inventory
        run: |
          git fetch --no-tags --depth=1 origin cf62f5d554634acca5c2676c6af3d524747f8f40
          python tools/inspect_xcmate69.py
      - name: Install test dependencies
        run: python -m pip install 'Pillow>=11,<13' 'impacket==0.13.0' 'simpleeval==0.9.13'
      - name: Compile and run .69 regression cases
        run: |
          python -m compileall -q src tools
          python -m unittest discover -s tests -p '*02969.py' -v
      - name: Measure pinned .68 versus .69 under failed persistence
        run: python tools/benchmark_xcmate69.py --output xcmate69-host-evidence.json
      - name: Upload replay measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcmate69-performance-${{ github.sha }}
          path: xcmate69-host-evidence.json
          if-no-files-found: warn
          retention-days: 14
      - name: Recheck affected historical widget and branding contracts
        run: |
          python - <<'PY'
          import sys,unittest
          sys.path[:0]=['tests','src/plugin.video.xtreammate/resources/lib']
          modules=['test_gsmedia_repo_180','test_repository_layout','test_xcmate_branding','test_xcmate_cumulative_02922','test_xcmate_helper_02957','test_xcmate_live_home_02950','test_xcmate_live_reader_02962','test_xcmate_p0_02958','test_xcmate_programme_integration_02947','test_xcmate_programme_widgets_02946','test_xcmate_series_02952','test_xcmate_viewport_02936','test_xcmate_widget_master_02946','test_xcmate_widget_pipeline_02947','test_xcmate_widget_refresh_02945','test_xcmate_widgets_02941']
          result=unittest.TextTestRunner(verbosity=2).run(unittest.defaultTestLoader.loadTestsFromNames(modules))
          if not result.wasSuccessful():raise SystemExit(1)
          PY
