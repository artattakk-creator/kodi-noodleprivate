name: GS Media Wizard 0.5.7 SlyGuy original repository bootstrap
on:
  push:
    branches: [fix/gsmedia-wizard-057-slyguy-repo-20261103]
  pull_request:
    paths:
      - 'src/script.gsmedia.setup/**'
      - 'tools/build_gsmedia_setup.py'
      - 'tools/build_gsmedia_pilot050.py'
      - 'vendor/jurialmunkey-common-0235/**'
      - 'vendor/gsmedia-source-batch-055/**'
      - 'vendor/xvault-official-repository-103/**'
      - 'vendor/slyguy-repository-009/**'
      - 'tests/test_gsmedia_origin_guard52.py'
      - 'tests/test_gsmedia_setup_auto50.py'
      - '.github/workflows/gsmedia-057-oneclick.yml'
permissions:
  contents: read
jobs:
  verify-dev-wizard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile new wizard
        run: python -m compileall -q src/script.gsmedia.setup
      - name: Verify one-button pure-state safety tests
        run: python -m unittest discover -s tests -p 'test_gsmedia_setup_auto50.py' -v
      - name: Verify crash recovery for temporary Kodi addon-source permission
        run: python -m unittest discover -s tests -p 'test_gsmedia_origin_guard52.py' -v
      - name: Verify first-party Kodi-native dependency bridge
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('tools/gsmedia_053_shortcuts_bridge')
          addon=ET.parse(root/'addon.xml').getroot()
          assert addon.get('id')=='script.gsmedia.skinshortcuts.bridge'
          assert addon.get('version')=='0.1.0'
          assert ('script.skinshortcuts','2.1.0') in [(x.get('addon'),x.get('version')) for x in addon.findall('./requires/import')]
          code=Path('src/script.gsmedia.setup/resources/lib/setup_auto_ui50.py').read_text()
          assert 'InstallAddon(" + install_id + ")' in code
          assert '"script.gsmedia.skinshortcuts.bridge" if native_upgrade else ident' in code
          assert 'TemporaryOfficialAddonSource(profile, xbmc.executeJSONRPC)' in code
          assert 'with scope:' in code
          assert 'restore_origin_policy(profile, xbmc.executeJSONRPC)' in code
          assert 'Versionen einmalig' not in code
          print('NATIVE_DEPENDENCY_BRIDGE_OK')
          PY
      - name: Build exact GS Media Setup 0.5.7 zip
        run: python tools/build_gsmedia_setup.py .build/gsmedia-057
      - name: Validate test package and SHA
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,zipfile,xml.etree.ElementTree as ET
          p=Path('.build/gsmedia-057/script.gsmedia.setup-0.5.7.zip')
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest in p.with_suffix('.zip.sha256').read_text()
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              assert ET.fromstring(z.read('script.gsmedia.setup/addon.xml')).get('version')=='0.5.7'
              assert 'script.gsmedia.setup/resources/lib/setup_auto_ui50.py' in z.namelist()
          print('GS Media 0.5.7 TEST ZIP',digest)
          PY
      - name: Build first-party Kodi ZIPs for isolated pilot
        run: |
          python -m pip install pillow
          python tools/build_repository.py
      - name: Build isolated pilot index with vendor-approved BINGIE repo
        run: python tools/build_gsmedia_pilot050.py .build/gsmedia-057-pilot
      - name: Validate vendor bootstrap stays separately indexed
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET,zipfile
          root=Path('.build/gsmedia-057-pilot')
          idx=ET.parse(root/'addons.xml').getroot()
          ids={a.get('id') for a in idx.findall('addon')}
          assert ids == {'repository.gsmedia.pilot','repository.titan.bingie.mod','repository.xvault','repository.slyguy','script.skinshortcuts','script.gsmedia.skinshortcuts.bridge','script.module.jurialmunkey','script.module.resolveurl','script.module.resolveurl.xxx','plugin.video.cumination','script.gsmedia.setup','plugin.video.xtreammate','plugin.video.noodleprivate'},ids
          with zipfile.ZipFile(root/'repository.titan.bingie.mod/repository.titan.bingie.mod-2.0.1.zip') as z:
              a=ET.fromstring(z.read('repository.titan.bingie.mod/addon.xml'))
              assert a.get('version')=='2.0.1'
          assert (root/'repository.titan.bingie.mod/LICENSE').is_file()
          with zipfile.ZipFile(root/'script.skinshortcuts/script.skinshortcuts-2.1.0.zip') as z:
              a=ET.fromstring(z.read('script.skinshortcuts/addon.xml'))
              assert a.get('version')=='2.1.0'
              assert a.findtext('./extension[@point="xbmc.addon.metadata"]/license')=='GPL-2.0-only'
          assert (root/'script.skinshortcuts/SOURCE.txt').is_file()
          with zipfile.ZipFile(root/'script.gsmedia.skinshortcuts.bridge/script.gsmedia.skinshortcuts.bridge-0.1.0.zip') as z:
              a=ET.fromstring(z.read('script.gsmedia.skinshortcuts.bridge/addon.xml'))
              assert a.get('id')=='script.gsmedia.skinshortcuts.bridge'
              assert ('script.skinshortcuts','2.1.0') in [(x.get('addon'),x.get('version')) for x in a.findall('./requires/import')]
          with zipfile.ZipFile(root/'script.module.jurialmunkey/script.module.jurialmunkey-0.2.35.zip') as z:
              a=ET.fromstring(z.read('script.module.jurialmunkey/addon.xml'))
              assert a.get('id')=='script.module.jurialmunkey'
              assert a.get('version')=='0.2.35'
              assert a.findtext('./extension[@point="xbmc.addon.metadata"]/license')=='GPL-3.0-or-later'
          assert (root/'script.module.jurialmunkey/SOURCE.txt').is_file()
          code=Path('src/script.gsmedia.setup/resources/lib/setup_auto50.py').read_text()
          assert 'elif ident == "script.module.jurialmunkey":' in code
          print('JURIALMUNKEY_GPL_ORIGINAL_PACKAGE_OK')
          for addon_id,version in [('script.module.resolveurl','5.1.212'),
                                   ('script.module.resolveurl.xxx','2.1.44'),
                                   ('plugin.video.cumination','1.1.206')]:
              zipfile_path=root/addon_id/(addon_id+'-'+version+'.zip')
              with zipfile.ZipFile(zipfile_path) as z:
                  assert z.testzip() is None
                  addon=ET.fromstring(z.read(addon_id+'/addon.xml'))
                  assert addon.get('id')==addon_id and addon.get('version')==version
                  if addon_id=='plugin.video.cumination':
                      assert addon.findtext('./extension[@point="xbmc.addon.metadata"]/license')=='GPL 2.0'
              assert (root/addon_id/'SOURCE.txt').is_file()
          print('RESOLVEURL_AND_CUMINATION_3_PAKET_BATCH_OK')
          with zipfile.ZipFile(root/'repository.xvault/repository.xvault-1.0.3.zip') as z:
              orig=ET.fromstring(z.read('repository.xvault/addon.xml'))
              assert orig.get('id')=='repository.xvault' and orig.get('version')=='1.0.3'
              feed=orig.find("./extension[@point='xbmc.addon.repository']/dir")
              assert feed.findtext('info')=='https://xvault.repowork.de/addons.xml'
              assert feed.findtext('checksum')=='https://xvault.repowork.de/addons.xml.md5'
              assert feed.findtext('datadir')=='https://xvault.repowork.de/'
          assert (root/'repository.xvault/SOURCE.txt').is_file()
          assert not (root/'plugin.video.xvault').exists()
          print('XVAULT_OFFICIAL_REPOSITORY_ONLY_GPL3_OK')
          with zipfile.ZipFile(root/'repository.slyguy/repository.slyguy-0.0.9.zip') as z:
              r=ET.fromstring(z.read('repository.slyguy/addon.xml'))
              assert r.get('id')=='repository.slyguy' and r.get('version')=='0.0.9'
              src=r.find("./extension[@point='xbmc.addon.repository']/dir")
              assert src is not None and 'slyguy.uk' in (src.findtext('info') or '')
              assert 'slyguy.uk' in (src.findtext('datadir') or '')
          assert (root/'repository.slyguy/SOURCE.txt').is_file()
          assert not (root/'slyguy.trailers').exists()
          print('SLYGUY_OFFICIAL_REPOSITORY_ONLY_OK')
          print('BRIDGE_PACKAGE_OK')
          print('BINGIE ORIGINAL REPO BOOTSTRAP: VERIFIED AND INDEXED')
          PY
      - name: Upload development-only wizard ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gsmedia-057-slyguy-official-repo-candidate
          path: |
            .build/gsmedia-057/script.gsmedia.setup-0.5.7.zip
            .build/gsmedia-057/script.gsmedia.setup-0.5.7.zip.sha256
            .build/gsmedia-057-pilot/
          if-no-files-found: error
