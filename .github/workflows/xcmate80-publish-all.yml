name: Release XCMate 0.1.29.80 to all user-approved repositories

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/xcmate78-publish-all.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xcmate78-all-channel-publication
  cancel-in-progress: false

jobs:
  publish-verified-78:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enforce merged .78 source, review ZIP and user-approved release gate
        run: |
          python - <<'PY'
          import json,xml.etree.ElementTree as ET
          from pathlib import Path
          src=ET.parse('src/plugin.video.xtreammate/addon.xml').getroot()
          assert (src.get('id'),src.get('version'))==('plugin.video.xtreammate','0.1.29.80')
          approval=json.loads(Path('docs/XCMate/releases/user-approved-untested-0.1.29.80.json').read_text())
          assert approval['authorization_issue']==389\n          assert approval['source_merge_pr']==390\n          assert approval['sha256']=='138b1dd522032d28c23044c68879fbe59c467a4524027b2152dca1887edee7ae'
          assert approval['user_approved_all_channels'] is True\n          assert approval['user_approved_pilot_release'] is True
          assert approval['android_status']=='NOT_TESTED'
          assert approval['android_pass_claimed'] is False
          PY
          python tools/release_channel75.py

      - name: Stage pinned original .78 ZIP in regular, Pilot and NeoDark3
        run: python tools/publish_xcmate78_all.py --stage

      - name: Verify source parity, ZIP CRC, XML + MD5 and protected installer
        run: |
          python tools/publish_xcmate78_all.py
          python - <<'PY'
          import subprocess
          import pathlib
          valid={
            'addons.xml','addons.xml.md5','index.html',
            'online-test/addons.xml','online-test/addons.xml.md5',
            'online-test/manifest.json','online-test/index.html',
            'plugin.video.xtreammate/plugin.video.xtreammate-0.1.29.80.zip',
            'plugin.video.xtreammate/plugin.video.xtreammate-0.1.29.80.zip.sha256',
            'online-test/plugin.video.xtreammate/plugin.video.xtreammate-0.1.29.80.zip',
            'online-test/plugin.video.xtreammate/plugin.video.xtreammate-0.1.29.80.zip.sha256',
            'online-test/plugin.video.xtreammate-0.1.29.80.zip',
            'online-test/plugin.video.xtreammate-0.1.29.80.zip.sha256',
          }
          changed={line[3:] for line in subprocess.check_output(
              ['git','status','--porcelain','--untracked-files=all'],text=True).splitlines()}
          assert changed.issubset(valid),f'OUT_OF_SCOPE_RELEASE_MUTATION: {changed-valid}'
          assert pathlib.Path('online-test/index.html').read_text().count(
              'href="plugin.video.xtreammate-0.1.29.80.zip"')==1
          assert pathlib.Path('index.html').read_text().count(
              'href="plugin.video.xtreammate/plugin.video.xtreammate-0.1.29.80.zip"')==1
          print('XCMATE_02980_RELEASE_STAGED', sorted(changed))
          PY

      - name: Commit and publish verified all-channel update on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            addons.xml addons.xml.md5 index.html \
            online-test/addons.xml online-test/addons.xml.md5 \
            online-test/manifest.json online-test/index.html \
            plugin.video.xtreammate/plugin.video.xtreammate-0.1.29.80.zip \
            plugin.video.xtreammate/plugin.video.xtreammate-0.1.29.80.zip.sha256 \
            online-test/plugin.video.xtreammate/plugin.video.xtreammate-0.1.29.80.zip \
            online-test/plugin.video.xtreammate/plugin.video.xtreammate-0.1.29.80.zip.sha256 \
            online-test/plugin.video.xtreammate-0.1.29.80.zip \
            online-test/plugin.video.xtreammate-0.1.29.80.zip.sha256
          if ! git diff --cached --quiet; then
            git commit -m "release(XCMate): publish pinned .78 across regular Pilot NeoDark3; Android not tested"
            git -c rebase.autoStash=true pull --rebase origin main
            python tools/publish_xcmate78_all.py
            git push origin HEAD:main
          else
            python tools/publish_xcmate78_all.py
          fi

      - name: Verify publicly downloadable .78 from all three paths
        run: |
          for attempt in 1 2 3 4 5 6; do
            if python tools/publish_xcmate78_all.py --public; then
              echo "PUBLIC_XCMATE_02980_ALL_CHANNELS_VERIFIED"
              exit 0
            fi
            sleep 8
          done
          echo "PUBLIC_XCMATE_02980_NOT_YET_VERIFIED" >&2
          exit 1
