name: XCMate .86 native pictures under reserve pressure
on:
  pull_request:
    branches: [main]
    paths: ['src/plugin.video.xtreammate/**', 'tests/**', 'tools/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: visible86-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  pictures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        resolution: [1920x1080, 1280x720]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13' 'simpleeval==0.9.13'
      - run: python tools/run_kodi_home86_contract.py --report-dir "${{ runner.temp }}/visible84" --resolution "${{ matrix.resolution }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visible86-${{ matrix.resolution }}
          path: |
            ${{ runner.temp }}/visible84/*.json
            ${{ runner.temp }}/visible84/*.png
            ${{ runner.temp }}/visible84/*.txt
            ${{ runner.temp }}/visible84/*.log
            ${{ runner.temp }}/visible84/*.jsonl
          retention-days: 30
