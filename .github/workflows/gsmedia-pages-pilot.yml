name: Serve isolated GS Media Kodi online pilot via Pages
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gsmedia-pages-pilot.yml"
      - "online-test/**"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gsmedia-pages-online-pilot
  cancel-in-progress: false
jobs:
  publish-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload only isolated online pilot packages
        uses: actions/upload-pages-artifact@v3
        with:
          path: online-test
      - name: Deploy public HTTPS Kodi directory
        id: deployment
        uses: actions/deploy-pages@v4
