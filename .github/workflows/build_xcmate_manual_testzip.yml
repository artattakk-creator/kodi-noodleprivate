name: Stage opt-in XCMate 0.1.29.3 manual ZIP
on:
  push:
    branches: [fix/xcmate-0293-first-run-setup-focus]
    paths:
      - ".github/workflows/build_xcmate_manual_testzip.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    if: github.repository == 'artattakk-creator/kodi-noodleprivate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install artwork dependency
        run: python -m pip install 'Pillow>=11,<13'
      - name: Bootstrap pinned XtreamMate GPL source
        run: python tools/bootstrap_xtreammate.py
      - name: Apply XCMate 0.1.1 patch
        run: python tools/apply_xtreammate_upgrade.py
      - name: Apply XCMate 0.1.2 patch
        run: python tools/apply_xtreammate_012.py
      - name: Apply XCMate 0.1.5 patch
        run: python tools/apply_xtreammate_015.py
      - name: Build Kodi packages and index
        run: python tools/build_repository.py
      - name: Verify manual test ZIP and generate download listing
        run: |
          python - <<'PY'
          import hashlib
          import html
          import json
          import re
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath
          import xml.etree.ElementTree as ET
          root=Path('src/plugin.video.xtreammate')
          addon=ET.parse(root/'addon.xml').getroot()
          version=addon.get('version')
          assert addon.get('id')=='plugin.video.xtreammate' and version=='0.1.29.3'
          filename=f'plugin.video.xtreammate-{version}.zip'
          package=Path('plugin.video.xtreammate')/filename
          assert package.is_file()
          target=Path('testversionen')/filename
          target.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(package) as arc:
              assert arc.testzip() is None
              names=arc.namelist()
              assert len(names)==len(set(names))
              expected={'plugin.video.xtreammate/'+p.relative_to(root).as_posix():p
                        for p in root.rglob('*') if p.is_file()
                        and '__pycache__' not in p.parts and p.suffix not in ('.pyc','.pyo')
                        and p.name != '.DS_Store'}
              assert set(names)==set(expected), 'Incomplete build'
              for entry in arc.infolist():
                  name=PurePosixPath(entry.filename)
                  assert not name.is_absolute() and '..' not in name.parts
                  assert not stat.S_ISLNK(entry.external_attr >> 16)
                  assert arc.read(entry)==expected[entry.filename].read_bytes(), entry.filename
              installed=ET.fromstring(arc.read('plugin.video.xtreammate/addon.xml'))
              assert installed.get('version')==version
              assert installed.get('id')=='plugin.video.xtreammate'
          shutil.copyfile(package,target)
          digest=hashlib.sha256(target.read_bytes()).hexdigest()
          target.with_name(filename+'.sha256').write_text(digest+'  '+filename+'\n')
          metadata={'addon':'plugin.video.xtreammate','version':version,
                    'sha256':digest,'bytes':target.stat().st_size,
                    'distribution':'manual test only','auto_update':False}
          Path('testversionen/build.json').write_text(json.dumps(metadata,indent=2)+'\n')
          index='''<!doctype html>
          <html lang="de"><head><meta charset="utf-8"><title>GS Media XCMate Testversion</title></head><body>
          <h1>XCMate 0.1.29.3 – manuelles Testpaket</h1>
          <p>Dies ist ein vollständiges Add-on-ZIP, kein Kodi-Repository-Update.
          Android-Erstinstallation vorläufig und auf eigene Entscheidung.</p>
          <pre><a href="'''+html.escape(filename,quote=True)+'''">'''+html.escape(filename)+'''</a></pre>
          <p>Im Kodi-Dateimanager diese Quelle und danach Aus ZIP-Datei installieren benutzen.</p>
          </body></html>'''
          Path('testversionen/index.html').write_text(index)
          print('STAGED',filename,digest)
          PY
      - name: Stage binary only on the opt-in branch (never main)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add testversionen/
          if git diff --cached --quiet; then
            echo 'Manual test ZIP unchanged'
          else
            git commit -m 'Stage opt-in XCMate 0.1.29.3 ZIP (not repository index)'
            git push origin HEAD:fix/xcmate-0293-first-run-setup-focus
          fi
