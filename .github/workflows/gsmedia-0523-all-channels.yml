name: Build and verify XCMate Media Center Installer 0.5.23 (Regular + Pilot + NeoDark3)

on:
  pull_request:
    paths:
      - ".github/workflows/gsmedia-0523-pilot.yml"
      - "tools/build_gsmedia_setup_0523.py"
      - "tools/gsmedia_setup0523/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/gsmedia-0523-pilot.yml"
      - "tools/build_gsmedia_setup_0523.py"
      - "tools/gsmedia_setup0523/**"

permissions:
  contents: write

concurrency:
  group: gsmedia-0523-pilot-release
  cancel-in-progress: false

jobs:
  installer-0523-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Build from exact pinned Installer 0.5.21 and run staged dependency tests
        run: |
          python -m compileall -q tools/build_gsmedia_setup_0523.py tools/gsmedia_setup0523/base
          python tools/build_gsmedia_setup_0523.py --out "$RUNNER_TEMP/gsmedia-0523"

      - name: Verify independent ZIP file contents, CRC and version
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET
          out=Path(__import__('os').environ['RUNNER_TEMP'])/'gsmedia-0523'
          target=out/'script.gsmedia.setup-0.5.23.zip'
          digest=hashlib.sha256(target.read_bytes()).hexdigest()
          assert (out/'script.gsmedia.setup-0.5.23.zip.sha256').read_text().split()==[digest,target.name]
          with ZipFile(target) as z:
              assert z.testzip() is None
              assert len(z.namelist())==32
              xml=ET.fromstring(z.read('script.gsmedia.setup/addon.xml'))
              assert xml.get('id')=='script.gsmedia.setup' and xml.get('version')=='0.5.23'
              assert b'install_id = "script.gsmedia.bingie.bootstrap"' not in z.read(
                  'script.gsmedia.setup/resources/lib/setup_auto_ui50.py')
          print('INSTALLER_0523_PACKAGE_VERIFIED',digest)
          PY

      - name: Upload immutable host-tested installer candidate (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: gsmedia-installer-0523-verified-candidate
          path: |
            ${{ runner.temp }}/gsmedia-0523/script.gsmedia.setup-0.5.23.zip
            ${{ runner.temp }}/gsmedia-0523/script.gsmedia.setup-0.5.23.zip.sha256
            ${{ runner.temp }}/gsmedia-0523/installer0523-verification.json

      - name: Stage regular, Pilot and NeoDark3, keep older ZIPs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python tools/build_gsmedia_setup_0523.py --out "$RUNNER_TEMP/gsmedia-0523" --stage-all
          python - <<'PY'
          import hashlib, xml.etree.ElementTree as ET
          from pathlib import Path
          for prefix in (Path("."), Path("online-test")):
              data=(prefix/"addons.xml").read_bytes()
              catalog=ET.fromstring(data)
              setup=[a for a in catalog.findall("addon") if a.get("id")=="script.gsmedia.setup"]
              assert len(setup)==1 and setup[0].get("version")=="0.5.23"
              assert hashlib.md5(data).hexdigest()==(prefix/"addons.xml.md5").read_text().strip()
              assert (prefix/"script.gsmedia.setup/script.gsmedia.setup-0.5.23.zip").is_file()
              assert (prefix/"script.gsmedia.setup/script.gsmedia.setup-0.5.22.zip").is_file()
          b=Path("online-test/script.gsmedia.setup-0.5.23.zip").read_bytes()
          assert b==Path("script.gsmedia.setup/script.gsmedia.setup-0.5.23.zip").read_bytes()
          assert b==Path("online-test/script.gsmedia.setup/script.gsmedia.setup-0.5.23.zip").read_bytes()
          print("GS_MEDIA_ALL_THREE_PATHS_VALIDATED")
          PY
          git diff --check

      - name: Publish normal and pilot catalogs, verified ZIP and NeoDark3 index
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add online-test/ addons.xml addons.xml.md5 index.html script.gsmedia.setup/script.gsmedia.setup-0.5.23.zip
          if test -z "$(git diff --cached --name-only)"; then
            echo "Installer 0.5.23 already published"
          else
            git commit -m "Publish Installer 0.5.23 to regular, Pilot and NeoDark3"
            git push origin HEAD:main
          fi

      - name: Record verified publication SHA
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          sha256sum online-test/script.gsmedia.setup-0.5.23.zip script.gsmedia.setup/script.gsmedia.setup-0.5.23.zip
          git log -1 --oneline
