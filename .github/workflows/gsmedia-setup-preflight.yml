name: GS Media Setup 0.4.0 installer pilot
on:
  pull_request:
    paths:
      - 'src/script.gsmedia.setup/**'
      - 'tests/test_gsmedia_setup_wizard.py'
      - 'tests/test_gsmedia_setup_installer.py'
      - 'tests/test_gsmedia_setup_full.py'
      - 'tools/build_gsmedia_setup.py'
      - '.github/workflows/gsmedia-setup-preflight.yml'
  push:
    branches:
      - 'feat/gsmedia-setup-020-preflight-20261102'
    paths:
      - 'src/script.gsmedia.setup/**'
      - 'tests/test_gsmedia_setup_wizard.py'
      - 'tests/test_gsmedia_setup_installer.py'
      - 'tests/test_gsmedia_setup_full.py'
      - 'tools/build_gsmedia_setup.py'
      - '.github/workflows/gsmedia-setup-preflight.yml'
jobs:
  offline-preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: All Wizard and installer pilot unit tests
        run: python -m unittest discover -s tests -p 'test_gsmedia_setup*.py' -v
      - name: Python syntax
        run: python -m compileall -q src/script.gsmedia.setup
      - name: Build installable Kodi pilot ZIP
        run: python tools/build_gsmedia_setup.py .build/gsmedia-setup
      - name: Upload verified test artifact
        uses: actions/upload-artifact@v4
        with:
          name: gsmedia-setup-0.4.0-pilot
          path: |
            .build/gsmedia-setup/script.gsmedia.setup-0.4.0.zip
            .build/gsmedia-setup/script.gsmedia.setup-0.4.0.zip.sha256
          if-no-files-found: error
