name: Inspect pinned BINGIE and .63 baseline for .64
on:
  pull_request:
    branches: [main]
    paths: ["tools/inspect_bingie64.py", ".github/workflows/xcmate64.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'Pillow>=11,<13' 'simpleeval==0.9.13'
      - run: python tools/inspect_bingie64.py
