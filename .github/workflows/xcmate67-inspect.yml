name: Inspect fixed .66 baseline and .67 P0 reproductions
on:
  push:
    branches: [hotfix/xcmate-02967-live-epg-android]
    paths: ['tools/inspect_xcmate67.py', '.github/workflows/xcmate67-inspect.yml', 'tests/*02967.py', 'src/plugin.video.xtreammate/resources/lib/**']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - run: python tools/inspect_xcmate67.py
      - run: python -m unittest discover -s tests -p '*02967.py' -v
