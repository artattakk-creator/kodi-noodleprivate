name: XCMate .90 startup, native IR and 15-minute retention
on:
  pull_request:
    branches: [main]
    paths: ['src/plugin.video.xtreammate/**', 'tests/**', 'tools/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: Run only the original native widget picker during development diagnosis
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: visible90-${{ github.head_ref || github.ref }}-${{ inputs.diagnostic_only || false }}
  cancel-in-progress: true
jobs:
  pictures:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.diagnostic_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        resolution: [1920x1080, 1280x720]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13' 'simpleeval==0.9.13'
      - run: python tools/run_kodi_home90_contract.py --report-dir "${{ runner.temp }}/visible84" --resolution "${{ matrix.resolution }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visible90-${{ matrix.resolution }}
          path: |
            ${{ runner.temp }}/visible84/*.json
            ${{ runner.temp }}/visible84/*.png
            ${{ runner.temp }}/visible84/*.txt
            ${{ runner.temp }}/visible84/*.log
            ${{ runner.temp }}/visible84/*.jsonl
          retention-days: 30

  original-picker:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13' 'simpleeval==0.9.13'
      - run: python tools/run_kodi_picker90_contract.py --report-dir "${{ runner.temp }}/picker90" --resolution 1280x720
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native90-original-picker
          path: |
            ${{ runner.temp }}/picker90/*.json
            ${{ runner.temp }}/picker90/*.png
            ${{ runner.temp }}/picker90/*.xml
            ${{ runner.temp }}/picker90/*.properties
            ${{ runner.temp }}/picker90/*.txt
            ${{ runner.temp }}/picker90/*.log
          retention-days: 30
