name: Build XCMate Space Premium 98 (draft)
on:
  push:
    branches:
      - feat/xcmate-space-premium-installer
    paths:
      - 'themes/xcmate/space-premium/assets/**'
      - 'themes/xcmate/space-premium/theme.json'
      - 'themes/xcmate/space-premium/SHA256SUMS.txt'
      - 'themes/xcmate/space-premium/README.md'
      - 'themes/xcmate/space-premium/LICENSE.txt'
      - 'tools/build_xcmate_theme.py'
      - 'src/plugin.video.xtreammate/**'
      - '.github/workflows/xcmate-space-premium-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'artattakk-creator/kodi-noodleprivate' && github.ref == 'refs/heads/feat/xcmate-space-premium-installer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host-only Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Build and validate the approved 98 asset package
        run: |
          python - <<'PY'
          import json, os, shutil, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, str(Path('tools').resolve()))
          from build_xcmate_theme import build
          from theme_package import manifest, json_object
          src=Path('themes/xcmate/space-premium')
          spec=manifest(json_object((src/'theme.json').read_bytes()),'0.1.30')
          if spec['id']!='space-premium' or len(spec['required_files'])!=98:
              raise ValueError('Missing approved original assets')
          with tempfile.TemporaryDirectory(prefix='xcmate-98-') as tmp:
              stage=Path(tmp)/'source';stage.mkdir()
              for rel in ['theme.json','SHA256SUMS.txt','README.md','LICENSE.txt']+spec['required_files']:
                  target=stage/rel;target.parent.mkdir(parents=True,exist_ok=True)
                  shutil.copyfile(src/rel,target)
              output=Path(tmp)/'XCMate-Space-Premium-1.0.0.zip'
              report=build(stage,output)
              committed=src/output.name
              if committed.exists() and committed.read_bytes()!=output.read_bytes():
                  raise ValueError('Immutable theme version changed: choose a new version before review')
              for filename in [output,output.with_suffix('.zip.sha256'),output.with_suffix('.validation.json')]:
                  shutil.copyfile(filename,src/filename.name)
              print(json.dumps({k:v for k,v in report.items() if k!='images'},indent=2))
          PY
      - name: Repack XCMate 0.1.30 candidate with permanently bundled approved core icon
        run: |
          python - <<'PY'
          import hashlib, shutil, tempfile, zipfile
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from tools.build_repository import package_file
          addon='plugin.video.xtreammate'
          src=Path('src')/addon
          icon=src/'icon.png'
          expected='81da1003a2753ec6afbdd50b2a320e738a2131ad9f0d76606da1babdd0d2f135'
          if hashlib.sha256(icon.read_bytes()).hexdigest()!=expected:
              raise ValueError('The approved XCMate core icon was changed')
          version=ET.parse(src/'addon.xml').getroot().get('version')
          if version!='0.1.30':
              raise ValueError('Wrong XCMate core candidate')
          dest=Path(addon)/(addon+'-'+version+'.zip')
          with tempfile.TemporaryDirectory(prefix='xcmate-core-') as tmp:
              output=Path(tmp)/dest.name
              with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED,compresslevel=8) as archive:
                  for path in sorted(src.rglob('*')):
                      if path.is_file() and '__pycache__' not in path.parts and path.name!='.DS_Store':
                          member=(Path(addon)/path.relative_to(src)).as_posix()
                          package_file(archive,addon,path,member)
              with zipfile.ZipFile(output) as archive:
                  if archive.testzip() is not None or archive.read(addon+'/icon.png')!=icon.read_bytes():
                      raise ValueError('Core package is invalid or branding missing')
              dest.parent.mkdir(parents=True,exist_ok=True)
              shutil.copyfile(output,dest)
              digest=hashlib.sha256(output.read_bytes()).hexdigest()
              dest.with_name(dest.name+'.sha256').write_text(digest+'  '+dest.name+'\n')
              print('XCMate core 0.1.30 RC SHA256:',digest)
          PY
      - name: Upload verified theme for PR review
        uses: actions/upload-artifact@v4
        with:
          name: xcmate-space-premium-1.0.0-draft
          path: |
            themes/xcmate/space-premium/XCMate-Space-Premium-1.0.0.zip
            themes/xcmate/space-premium/XCMate-Space-Premium-1.0.0.zip.sha256
            themes/xcmate/space-premium/XCMate-Space-Premium-1.0.0.validation.json
            plugin.video.xtreammate/plugin.video.xtreammate-0.1.30.zip
            plugin.video.xtreammate/plugin.video.xtreammate-0.1.30.zip.sha256
          if-no-files-found: error
